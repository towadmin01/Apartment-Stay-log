<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>TOW Apartment Stay Log · Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="icon" type="image/png" href="favicon.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
body{font-size:14.5px}
header.bar{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.stat .k{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.stat .v{font:600 30px/1.1 "Cormorant Garamond",serif;color:var(--brown);margin-top:4px}
.stat .s{font-size:12px;color:var(--muted)}
.units{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:#fff;border-radius:20px;padding:7px 14px;cursor:pointer;font:500 13px Jost;color:var(--brown)}
.tab.on{background:var(--brown);color:#fff;border-color:var(--brown)}
.tab .c{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:#c9853f;color:#fff;font-size:11px;margin-left:5px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filters input{flex:1;min-width:180px}.filters select{width:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-weight:500;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);padding:8px}
td{border-bottom:1px solid #f0e9dc;padding:10px 8px;vertical-align:top}
td:first-child{white-space:nowrap}
tr.trow{cursor:pointer}tr.trow:hover td{background:var(--soft)}
.pill{display:inline-block;font-size:11.5px;padding:2px 9px;border-radius:20px;border:1px solid var(--line);white-space:nowrap;background:#f3f0ea}
.p-Requested,.p-Submitted{background:#fff2e0;border-color:#efcf9c;color:#8a5a1f}.p-Booked{background:#fff7e6;border-color:#ecd6a6}.p-Confirmed{background:#eef4ea;border-color:#c9dcc0}.p-Checked-in{background:#e8f0f6;border-color:#bcd2e2}.p-Cancelled{background:#f8ebe6;border-color:#e6c4b4;color:var(--warn)}
.empty{padding:30px;text-align:center;color:var(--muted)}
.ov{position:fixed;inset:0;background:rgba(40,30,20,.35);display:none;z-index:20}.ov.open{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(580px,100%);background:var(--bg);z-index:21;transform:translateX(100%);transition:transform .25s;display:flex;flex-direction:column}
.drawer.open{transform:none}
.dh{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;background:#fff}
.db{padding:16px 20px;overflow:auto;flex:1}
.df{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;background:#fff}
.grp{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.grp h3{font:600 16px "Cormorant Garamond",serif;color:var(--brown);margin:0 0 10px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.kvt td{padding:5px 6px;font-size:13px}.kvt td:first-child{color:var(--muted);width:38%;white-space:normal}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--brown);color:#fff;padding:10px 16px;border-radius:10px;font-size:13.5px;z-index:40;display:none;max-width:90%}
.rep h3{font:600 18px "Cormorant Garamond",serif;color:var(--brown);margin:18px 0 8px}
.rep .head{display:flex;justify-content:space-between;align-items:center;border-bottom:1.5px solid var(--gold);padding-bottom:10px;margin-bottom:12px}
.rep .head img{height:54px}
.rep .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.rep .kpi{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.rep .kpi b{display:block;font:600 26px "Cormorant Garamond",serif;color:var(--brown)}
.rep .kpi span{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.rep .two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.rep table td,.rep table th{padding:6px 8px;font-size:12.5px}
.rep td.n,.rep th.n{text-align:right}
.bar{height:8px;background:var(--accent,var(--gold));border-radius:4px;opacity:.75}
.secgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px;align-items:start}
.sec{border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:12px;background:#fff;overflow:hidden}
.sec.wide{grid-column:1/-1}
.sech{display:flex;align-items:center;gap:10px;padding:10px 12px;background:color-mix(in srgb,var(--accent) 10%,#fff);border-bottom:1px solid color-mix(in srgb,var(--accent) 22%,#fff)}
.sech .ic{font-size:17px}
.sech .st{font:600 17px "Cormorant Garamond",serif;color:var(--accent);flex:1}
.sech .cnt{font-size:11.5px;color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 40%,#fff);border-radius:20px;padding:1px 9px;background:#fff}
.sech .eye{border:0;background:transparent;color:var(--accent);cursor:pointer;padding:3px;border-radius:6px;display:grid;place-items:center}
.sech .eye:hover{background:#fff}
.secb{padding:8px 12px 12px}
.sec.collapsed .secb{display:none}
.sec.collapsed{opacity:.6}.sec.collapsed .sech{border-bottom:0}
.sec th{color:var(--accent)}
@media print{
  body{background:#fff}
  #loginView,header.bar,.stats,#unitsCard,.tabs,.filters,.no-print,.wrap.wide>p,.drawer,.ov,.toast{display:none!important}
  .wrap.wide{max-width:none;padding:0}
  .card{border:0;padding:0;margin:0}
  .rep .kpis{grid-template-columns:repeat(4,1fr)}
  .rep h3{break-after:avoid}.rep table{break-inside:auto}.rep tr{break-inside:avoid}
  .sec.collapsed{display:none!important}.sec{break-inside:avoid-page;-webkit-print-color-adjust:exact;print-color-adjust:exact}.sech{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .secgrid{gap:10px}
  @page{size:A4;margin:14mm}
}
@media (max-width:760px){.secgrid{grid-template-columns:1fr}.rep .kpis{grid-template-columns:1fr 1fr}.stats{grid-template-columns:1fr 1fr}.units{grid-template-columns:1fr 1fr}.hide-m{display:none}}
</style>
</head>
<body>
<div class="wrap" id="loginView">
  <section class="card" style="margin-top:50px">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:14px">
      <div><div class="eyebrow">Tabernacle of Worship</div><h1 style="margin:6px 0 2px;font-size:26px;white-space:nowrap">Apartment Stay Log</h1><div class="muted small">Admin use only.</div></div>
      <img src="logo-mark.png" alt="TOW" style="width:56px;height:56px;flex:none">
    </div>
    <div class="f"><label>Admin passcode</label><input id="passcode" type="password"></div>
    <label class="inline" style="margin:0 0 6px"><input type="checkbox" id="remember" checked> Remember on this device</label>
    <button class="btn pri" id="loginBtn">Open log</button>
    <div class="msg" id="loginMsg"></div>
  </section>
</div>

<div class="wrap wide hide" id="appView">
  <header class="bar">
    <div style="display:flex;gap:14px;align-items:center"><img src="logo-mark.png" alt="TOW" style="width:52px;height:52px"><div><div class="eyebrow">Tabernacle of Worship · Admin</div><h1 style="margin-bottom:0">Apartment Stay Log</h1></div></div>
    <div class="actions">
      <button class="btn sm" id="refreshBtn">↻ Refresh</button>
      <button class="btn sm" id="xlsBtn">⬇ Excel</button>
      <button class="btn sm" id="newHostBtn">+ Guest speaker</button>
      <button class="btn sm pri" id="newStayBtn">+ New stay</button>
    </div>
  </header>
  <div class="stats" id="stats"></div>
  <section class="card" id="unitsCard"><h2>Units today</h2><div class="units" id="units"></div></section>
  <section class="card">
    <div class="tabs" id="tabs"></div>
    <div class="filters" id="filters">
      <input id="q" placeholder="Search name, ministry, personnel…">
      <select id="fStatus"></select>
      <select id="fUnit"><option value="">All units</option><option>1</option><option>2</option><option>3</option><option>4</option></select>
      <select id="fYear"><option value="">All years</option></select>
    </div>
    <div style="overflow-x:auto" id="tableWrap"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>
    <div id="reportWrap" class="hide">
      <div class="toolbar no-print" style="align-items:center"><select id="rYear" style="width:auto"></select><button class="btn sm" id="showAll">👁 Show all</button><button class="btn sm" id="hideAll">Hide all</button><button class="btn sm pri" id="printBtn">🖨 Print / Save as PDF</button><span style="flex:1"></span><button class="btn sm" id="backupBtn">☁️ Back up now</button><span class="small muted" id="backupInfo"></span></div>
      <p class="small muted no-print" style="margin:-4px 0 12px">Tap 👁 on a section to hide it. Hidden sections are left out when you print.</p>
      <div id="report"></div>
    </div>
  </section>
  <p class="small muted center">Links to share · Ministry Heads: <a id="headLink" target="_blank" style="color:var(--gold)"></a> · <a href="#" id="logout" style="color:var(--gold)">Sign out</a></p>
</div>

<div class="ov" id="ov"></div>
<aside class="drawer" id="drawer">
  <div class="dh"><h2 style="margin:0" id="dTitle"></h2><button class="btn sm" id="closeBtn">✕</button></div>
  <div class="db" id="dBody"></div>
  <div class="df" id="dFoot"></div>
</aside>
<datalist id="people"></datalist>
<datalist id="unitList"><option>1</option><option>2</option><option>3</option><option>4</option><option>2 &amp; 4</option></datalist>
<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script src="app.js"></script>
<script>
let KEY = "", S = [], HS = [], MINS = [], SITE = "", TAB = "inbox", cur = null, LAST_BACKUP = null;
const STAY_STATUS = ["Requested", "Booked", "Confirmed", "Checked-in", "Completed", "Cancelled"];
const HOST_STATUS = ["Link sent", "In progress", "Submitted", "Received", "Sent to Accounts", "Closed"];
const HEAD = ["Stay ID","Status","Category","Name of User","Main Guest","Purpose of Use","Ministry","Ministry Head","Attending Personnel","Contact No.","Unit No.","No. of Guests","Arrival","Departure","Nights","Vehicle Details","Church Transport","Transport PIC","Guest Preferences / Special Notes","Love Gift (RM)","Love Gift Ref","Special Arrangement","Step 1: Assign Cleaners","Step 2: Unit Preparation","Step 3: Guest Essentials","Step 4: Before Check-in","Step 5: Meal Arrangement","Step 6: After Check-out","Final Checked By","Final Check Date","Additional Notes","Source","Approved By","Approved At","Submitted At","Acknowledged At","Hosting ID","PDF"];
const toast = t => { const el = $("toast"); el.textContent = t; el.style.display = "block"; clearTimeout(toast.t); toast.t = setTimeout(() => el.style.display = "none", 3000) };
const call = (action, body = {}) => api(action, { key: KEY, ...body });

/* ---------- login ---------- */
$("passcode").value = store.get("tow-admin-key") || "";
$("loginBtn").onclick = async () => {
  KEY = $("passcode").value.trim(); if (!KEY) return $("loginMsg").textContent = "Please type the admin passcode."; $("loginMsg").textContent = "Logging in…"; $("loginBtn").disabled = true;
  try { await load(); if ($("remember").checked) store.set("tow-admin-key", KEY); else store.del("tow-admin-key"); $("loginView").classList.add("hide"); $("appView").classList.remove("hide"); openFromHash() }
  catch (e) { $("loginMsg").textContent = e.message; if (/passcode/i.test(e.message)) store.del("tow-admin-key") }
  finally { $("loginBtn").disabled = false }
};
pwToggle("passcode");
$("logout").onclick = e => { e.preventDefault(); store.del("tow-admin-key"); location.reload() };
async function load() { const j = await call("list"); S = j.stays; HS = j.hosting; MINS = j.ministries; SITE = j.site; LAST_BACKUP = j.lastBackup || null; render(); showBackup() }
$("refreshBtn").onclick = async () => { try { await load(); toast("Up to date") } catch (e) { toast(e.message) } };
function openFromHash() { const id = decodeURIComponent(location.hash.slice(1)); if (!id) return; const s = S.find(x => x["Stay ID"] === id); if (s) return openStay(s); const h = HS.find(x => x["Hosting ID"] === id); if (h) openHost(h) }
window.addEventListener("hashchange", openFromHash);

/* ---------- render ---------- */
const live = () => S.filter(r => r.Status !== "Cancelled");
const minOf = name => MINS.find(m => m.ministry === name);
const accounts = () => MINS.find(m => m.ministry === "Accounts");
function render() {
  $("headLink").textContent = SITE + "head.html"; $("headLink").href = SITE + "head.html";
  const people = new Set(); S.forEach(r => ["Attending Personnel", "Transport PIC", "Step 1: Assign Cleaners", "Step 2: Unit Preparation", "Step 3: Guest Essentials", "Step 4: Before Check-in", "Step 5: Meal Arrangement", "Step 6: After Check-out", "Final Checked By"].forEach(k => r[k] && String(r[k]).length < 40 && people.add(String(r[k]).trim())));
  $("people").innerHTML = [...people].sort().map(p => `<option>${esc(p)}</option>`).join("");
  const years = [...new Set(S.map(r => (r.Arrival || "").slice(0, 4)).filter(Boolean))].sort().reverse();
  const fy = $("fYear").value; $("fYear").innerHTML = `<option value="">All years</option>` + years.map(y => `<option>${y}</option>`).join(""); $("fYear").value = fy;
  renderStats(); renderUnits(); renderTabs(); renderTable();
}
function renderStats() {
  const now = new Date(), y = now.getFullYear(), yr = live().filter(r => (r.Arrival || "").startsWith(String(y)));
  const up = live().filter(r => r.Status !== "Requested" && toD(r.Arrival) > now).sort((a, b) => toD(a.Arrival) - toD(b.Arrival));
  const gifts = yr.reduce((a, r) => a + (+r["Love Gift (RM)"] || 0), 0);
  $("stats").innerHTML = [["Stays in " + y, yr.length, "excluding cancelled"], ["Nights in " + y, yr.reduce((a, r) => a + (+r.Nights || 0), 0), "across all units"], ["Upcoming", up.length, up[0] ? "Next: " + fmtShort(up[0].Arrival) : "None"], ["Love gifts " + y, "RM" + gifts.toLocaleString(), "pledged"]]
    .map(([k, v, s]) => `<div class="stat"><div class="k">${k}</div><div class="v">${v}</div><div class="s">${esc(s)}</div></div>`).join("");
}
function renderUnits() {
  const now = new Date();
  $("units").innerHTML = [1, 2, 3, 4].map(u => {
    const mine = live().filter(r => r.Status !== "Requested" && unitsOf(r["Unit No."]).includes(String(u)));
    const occ = mine.find(r => toD(r.Arrival) <= now && toD(r.Departure) >= now);
    const next = mine.filter(r => toD(r.Arrival) > now).sort((a, b) => toD(a.Arrival) - toD(b.Arrival))[0];
    return `<div class="u"><b>Unit ${u}</b><span class="dot ${occ ? "busy" : "free"}"></span>${occ ? "Occupied · " + esc(occ["Name of User"]) : "Available"}<div class="small muted">${occ ? "Until " + fmtShort(occ.Departure) : next ? "Next: " + fmtShort(next.Arrival) : "No upcoming booking"}</div></div>`;
  }).join("");
}
const inboxItems = () => [...S.filter(r => r.Status === "Requested").map(r => ({ t: "stay", r })), ...HS.filter(h => h.Status === "Submitted").map(h => ({ t: "host", r: h }))];
function renderTabs() {
  const n = inboxItems().length;
  $("tabs").innerHTML = [["inbox", "Inbox", n], ["stays", "All stays"], ["hosting", "Guest speakers"], ["reports", "Reports"]].map(([k, l, c]) => `<button class="tab ${TAB === k ? "on" : ""}" data-t="${k}">${l}${c ? `<span class="c">${c}</span>` : ""}</button>`).join("");
  document.querySelectorAll(".tab").forEach(b => b.onclick = () => { TAB = b.dataset.t; $("fStatus").value = ""; render() });
  const st = TAB === "hosting" ? HOST_STATUS : STAY_STATUS, fs = $("fStatus").value;
  $("fStatus").innerHTML = `<option value="">All status</option>` + st.map(s => `<option>${s}</option>`).join(""); $("fStatus").value = st.includes(fs) ? fs : "";
  $("filters").classList.toggle("hide", TAB === "inbox" || TAB === "reports");
  $("tableWrap").classList.toggle("hide", TAB === "reports"); $("reportWrap").classList.toggle("hide", TAB !== "reports");
}
["q", "fStatus", "fUnit", "fYear"].forEach(id => $(id).addEventListener("input", renderTable));
function renderTable() {
  if (TAB === "reports") return renderReport();
  const q = $("q").value.toLowerCase(), fs = $("fStatus").value, fu = $("fUnit").value, fy = $("fYear").value;
  if (TAB === "inbox") {
    const items = inboxItems();
    $("thead").innerHTML = `<tr><th>ID</th><th>Type</th><th>Name</th><th>Dates</th><th class="hide-m">From</th><th>Next step</th></tr>`;
    $("tbody").innerHTML = items.length ? items.map(({ t, r }) => t === "stay"
      ? `<tr class="trow" data-s="${esc(r["Stay ID"])}"><td class="small muted">${esc(r["Stay ID"])}</td><td>🏠 Stay request</td><td><b style="font-weight:500">${esc(r["Name of User"])}</b><div class="small muted">${esc(r.Category)}</div></td><td>${fmtShort(r.Arrival)}<br>${fmtShort(r.Departure)}</td><td class="hide-m small">${esc(r.Ministry || r.Source || "")}${r["Approved By"] ? "<br>✔ " + esc(r["Approved By"]) : ""}</td><td><span class="pill p-Requested">Assign unit</span></td></tr>`
      : `<tr class="trow" data-h="${esc(r["Hosting ID"])}"><td class="small muted">${esc(r["Hosting ID"])}</td><td>🎤 Hosting</td><td><b style="font-weight:500">${esc(r["Guest Name"])}</b><div class="small muted">${esc(r["Stay Option"])}</div></td><td>${esc(r["Event Date(s)"] || "")}</td><td class="hide-m small">PIC: ${esc(r["Attending Personnel"])}</td><td><span class="pill p-Submitted">Review</span></td></tr>`).join("") : `<tr><td colspan="6" class="empty">All caught up 🙏</td></tr>`;
  } else if (TAB === "stays") {
    const rows = S.filter(r => (!fs || r.Status === fs) && (!fu || unitsOf(r["Unit No."]).includes(fu)) && (!fy || (r.Arrival || "").startsWith(fy)) && (!q || [r["Name of User"], r["Attending Personnel"], r["Purpose of Use"], r["Stay ID"], r.Ministry].join(" ").toLowerCase().includes(q))).sort((a, b) => (toD(b.Arrival) || 0) - (toD(a.Arrival) || 0));
    $("thead").innerHTML = `<tr><th>ID</th><th>Guest</th><th>Unit</th><th>Arrival</th><th>Departure</th><th class="hide-m">Nights</th><th class="hide-m">Personnel / ministry</th><th>Status</th></tr>`;
    $("tbody").innerHTML = rows.length ? rows.map(r => `<tr class="trow" data-s="${esc(r["Stay ID"])}"><td class="small muted">${esc(r["Stay ID"])}</td><td><b style="font-weight:500">${esc(r["Name of User"])}</b><div class="small muted">${esc(r["Purpose of Use"] || "")}</div></td><td>${esc(r["Unit No."] || "–")}</td><td>${fmtShort(r.Arrival)}</td><td>${fmtShort(r.Departure)}</td><td class="hide-m">${esc(r.Nights)}</td><td class="hide-m small">${esc(r["Attending Personnel"] || r.Ministry || "")}</td><td><span class="pill p-${esc(r.Status)}">${esc(r.Status)}</span></td></tr>`).join("") : `<tr><td colspan="8" class="empty">No stays match.</td></tr>`;
  } else {
    const rows = HS.filter(h => (!fs || h.Status === fs) && (!q || [h["Guest Name"], h["Attending Personnel"], h["Hosting ID"]].join(" ").toLowerCase().includes(q))).sort((a, b) => String(b["Created At"]).localeCompare(String(a["Created At"])));
    $("thead").innerHTML = `<tr><th>ID</th><th>Guest speaker</th><th>Event</th><th class="hide-m">PIC</th><th class="hide-m">Stay</th><th>Status</th></tr>`;
    $("tbody").innerHTML = rows.length ? rows.map(h => `<tr class="trow" data-h="${esc(h["Hosting ID"])}"><td class="small muted">${esc(h["Hosting ID"])}</td><td><b style="font-weight:500">${esc(h["Guest Name"])}</b><div class="small muted">${esc(h["Church / Ministry From"] || "")}</div></td><td>${esc(h["Event Date(s)"] || "")}</td><td class="hide-m">${esc(h["Attending Personnel"])}</td><td class="hide-m small">${esc(h["Stay Option"] || "–")}${h["Linked Stay ID"] ? " · " + esc(h["Linked Stay ID"]) : ""}</td><td><span class="pill p-${esc(String(h.Status).replace(/ /g, "-"))}">${esc(h.Status)}</span></td></tr>`).join("") : `<tr><td colspan="6" class="empty">No guest speakers yet. Use “+ Guest speaker”.</td></tr>`;
  }
  document.querySelectorAll("tr.trow").forEach(tr => tr.onclick = () => tr.dataset.s ? openStay(S.find(r => r["Stay ID"] === tr.dataset.s)) : openHost(HS.find(h => h["Hosting ID"] === tr.dataset.h)));
}

/* ---------- drawer helpers ---------- */
function openDrawer(title, body, foot) { $("dBody").oninput = null; $("dTitle").textContent = title; $("dBody").innerHTML = body; $("dFoot").innerHTML = foot; $("drawer").classList.add("open"); $("ov").classList.add("open") }
function closeDrawer() { $("drawer").classList.remove("open"); $("ov").classList.remove("open"); cur = null; if (location.hash) history.replaceState(null, "", location.pathname + location.search) }
$("closeBtn").onclick = closeDrawer; $("ov").onclick = closeDrawer;
const inp = (k, label, type = "text", extra = "") => `<div class="f"><label>${label}</label><input data-k="${k}" type="${type}" ${extra}></div>`;
const area = (k, label) => `<div class="f"><label>${label}</label><textarea data-k="${k}"></textarea></div>`;
const sel = (k, label, opts) => `<div class="f"><label>${label}</label><select data-k="${k}">${opts.map(o => `<option>${esc(o)}</option>`).join("")}</select></div>`;
const kvt = pairs => `<table class="kvt">${pairs.filter(p => p[1]).map(([k, v]) => `<tr><td>${esc(k)}</td><td>${esc(v).replace(/\n/g, "<br>")}</td></tr>`).join("")}</table>`;

function stayChecks() {

    ${sec("min", "⛪", "By ministry", "#a0674b", pl(byMin.length, "ministry", "ministries"), byMin.length ? tbl(["Ministry", "Stays", "Nights", "Love gifts"], byMin) : '<p class="muted small">No paid stays by ministry yet.</p>')}
    ${sec("host", "🎤", "Guest speakers hosted", "#7b6a9c", hs.length, hs.length ? tbl(["Guest", "Event", "PIC", "Stay"], hs.map(h => [esc(h["Guest Name"]), esc(h["Event Date(s)"] || ""), esc(h["Attending Personnel"] || ""), esc(h["Stay Option"] || "")])).replace(/class="n"/g, "") : '<p class="muted small">None recorded through the hosting checklist this year.</p>', true)}
    ${sec("all", "📋", "All stays", "#6b4f33", rows.length, tbl(["Guest", "Unit", "Arrival", "Departure", "Nights", "Category", "Love gift"], rows.map(r => [esc(r["Name of User"]) + `<div class="small muted">${esc(r["Stay ID"])}</div>`, esc(r["Unit No."] || "–"), fmtShort(r.Arrival), fmtShort(r.Departure), r.Nights || 0, esc(r.Category || ""), r["Love Gift (RM)"] ? "RM" + r["Love Gift (RM)"] : "–"])).replace(/class="n"/g, ""), true)}
    </div>
  </div>`;
  document.querySelectorAll("#report .sec").forEach(el => el.querySelector(".eye").onclick = () => {
    const k = el.dataset.key; el.classList.toggle("collapsed");
    if (el.classList.contains("collapsed")) hidden.add(k); else hidden.delete(k);
    store.set("tow-rep-hidden", JSON.stringify([...hidden])); el.querySelector(".eye").innerHTML = el.classList.contains("collapsed") ? EYE_OFF : EYE;
  });
}
function setAllSections(hide) { const keys = ["unit", "month", "cat", "min", "host", "all"]; store.set("tow-rep-hidden", JSON.stringify(hide ? keys : [])); renderReport() }

/* ---------- Excel ---------- */
$("xlsBtn").onclick = () => {
  if (!window.XLSX) return toast("Excel library still loading");
  const dates = ["Arrival", "Departure", "Final Check Date", "Approved At", "Submitted At", "Acknowledged At"];
  const rows = S.slice().sort((a, b) => (toD(a.Arrival) || 0) - (toD(b.Arrival) || 0)).map(r => HEAD.map(h => dates.includes(h) ? (toD(r[h]) || "") : (r[h] ?? "")));
  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet([HEAD, ...rows], { cellDates: true }); ws["!cols"] = HEAD.map(h => ({ wch: /Notes|Preferences|Name|Purpose|Personnel/.test(h) ? 30 : 14 }));
  XLSX.utils.book_append_sheet(wb, ws, "Stay Log");
  const HH = ["Hosting ID", "Status", "Guest Name", "Church / Ministry From", "Event Date(s)", "Attending Personnel", "PIC Contact", "Hosting Pastor", "Stay Option", "Arrival", "Departure", "Mode of Travel", "Travel Details", "Transport Needed", "Vehicle Details", "Accompanying Persons", "Apartment Guests", "Dietary & Meal Schedule", "Health Notes", "Account Holder", "Bank Name", "Account Number", "Mobile Number", "Linked Stay ID", "Submitted At", "Sent to Accounts At"];
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([HH, ...HS.map(h => HH.map(k => ["Arrival", "Departure", "Submitted At", "Sent to Accounts At"].includes(k) ? (toD(h[k]) || "") : (h[k] ?? "")))], { cellDates: true }), "Hosting");
  XLSX.writeFile(wb, `TOW-Apartment-Stay-Log-${iso(new Date())}.xlsx`, { cellDates: true });
};
// auto-login last, after everything above is ready
if (store.get("tow-admin-key")) $("loginBtn").click();
</script>
